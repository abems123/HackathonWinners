name: Website checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-only-synthetic-check-key-not-a-production-secret-123456789
      DJANGO_DEBUG: 'True'
      AI_MODE: cache
      BRON_BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock -r requirements-browser.txt
      - run: python -m playwright install chromium --with-deps
      - run: python -m ruff check .
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py collectstatic --noinput
      - run: python -m pytest -q
      - run: python tools/verify_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: output/browser/
