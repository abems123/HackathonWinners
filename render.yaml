services:
  - type: web
    name: hackathon-winners
    runtime: python
    plan: free
    region: frankfurt
    repo: https://github.com/abems123/HackathonWinners
    branch: main
    buildCommand: bash build.sh
    startCommand: bash start.sh
    healthCheckPath: /login/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.15
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: AI_MODE
        value: cache
      # Synthetic demo accounts (password on the login page). Set to "false"
      # before this service ever holds real data.
      - key: BRON_SEED_DEMO
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: hackathon-winners-db
          property: connectionString

databases:
  - name: hackathon-winners-db
    plan: free
    region: frankfurt
    databaseName: bron
    user: bron
